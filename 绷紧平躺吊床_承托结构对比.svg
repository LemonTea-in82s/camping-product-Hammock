<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="620" viewBox="0 0 1520 620" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">传统弧垂布兜式与多点绷紧平躺式吊床的承托结构对比</title>
<desc id="diagram-desc">左侧展示两端收拢的柔性床布自然弧垂。右侧以矩形款示意上下两层绳路，上绳斜拉悬挂，下绳与床面处于同一水平面，配合横撑展开睡面。上方虚线表示网帐和外帐。具体受力路径及配套随产品设计变化。</desc>
<defs>
  <style>
    text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#eaf0fa}
    .heading{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#8fa3c4}
    .label{font-size:19px;font-weight:600}.copy{font-size:19px}.fine{font-size:15px;fill:#8fa3c4}
    .line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .tree{stroke:#6c849b;stroke-width:2.5;opacity:.8}.leader{stroke:#8fa3c4;stroke-width:1.4}
    .soft{stroke:#3bc6c8;stroke-width:2.7}.taut{stroke:#f28c28;stroke-width:2.7}
  </style>
  <g id="tree" class="line tree">
    <path d="M-10 92 L-10 310 M10 83 L10 310 M-10 154 L-41 126 M10 184 L35 159 M-10 310 L-25 322 M10 310 L26 322"/>
    <path d="M0 16 C-37 27-49 57-39 78 C-76 97-64 140-25 142 C-10 161 25 159 39 136 C75 139 77 100 51 86 C61 54 35 24 0 16Z"/>
    <path d="M-15 161 L15 161 M-15 166 L15 166" stroke-width="4"/>
  </g>
</defs>
