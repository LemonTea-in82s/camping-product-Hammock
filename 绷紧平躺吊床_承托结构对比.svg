<path class="line leader" d="M1151 161 L1151 193"/>
<text class="label" x="955" y="185">上绳斜拉悬挂</text>
<path class="line leader" d="M977 197 L960 237 L942 264"/>
<text class="label" x="808" y="417">下绳水平张紧</text>
<text class="fine" x="808" y="443">与床面处于同一水平面</text>
<path class="line leader" d="M952 397 L938 368 L920 336"/>
<text class="label" x="1224" y="433">横撑／框架撑开睡面</text>
<path class="line leader" d="M1287 412 L1290 371 L1293 326"/>
<text class="copy" x="816" y="501">结构展开睡面，形成更平整、开放的睡眠区。</text>
<text class="copy" x="816" y="535">部分设计由匹配睡垫参与支撑和底部保温。</text>
<text class="fine" x="760" y="603" text-anchor="middle">承托机制示意，结构与外形依SKU变化。具体受载形状、调平方式及稳定性以实物验证为准。</text>
